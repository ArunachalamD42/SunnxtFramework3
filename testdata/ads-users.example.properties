# Copy/reference version. Edit ads-users.local.properties for local user details.
# Never put real credentials in this example file.
# Runtime environment values take priority over file credentials.
# The current Java selection is preserved: Annual Combo and Quarterly Combo enabled.
ads.accounts=COMBO_ANNUAL,SAMPLE,COMBO_QUARTERLY,SN_LITE,SNS_LITE,SNS_PREMIUM

# Required positive duration for pre-roll/mid-roll and entry to Shorts episode 6.
# Leave blank here when supplied through Eclipse or existing ConfigReader properties.
SUNNXT_AD_OBSERVATION_SECONDS=

# Expected values:
# sn.expected: PLAY or BLOCK (Movies, Live TV and TV Shows)
# ads.expected: ADS or NO_ADS
# shorts.expected: FULL (six-episode sample) or FIRST_7 (1-7 play, 8 blocked)
# Existing flow: 10 seconds per Shorts episode; Movies/TV mid-roll seek is 900 seconds.

# ==================== COMBO ANNUAL PLATINUM ====================
ads.COMBO_ANNUAL.enabled=true
ads.COMBO_ANNUAL.plan=Combo Annual Platinum
ads.COMBO_ANNUAL.sn.expected=PLAY
ads.COMBO_ANNUAL.ads.expected=NO_ADS
ads.COMBO_ANNUAL.shorts.expected=FULL
SUNNXT_ENTITLEMENT_COMBO_ANNUAL_CREDENTIAL_MOBILE=
SUNNXT_ENTITLEMENT_COMBO_ANNUAL_CREDENTIAL_PASSWORD=

# ==================== SN ANNUAL PREMIUM ====================
ads.SAMPLE.enabled=false
ads.SAMPLE.plan=SN Annual Premium
ads.SAMPLE.sn.expected=PLAY
ads.SAMPLE.ads.expected=NO_ADS
ads.SAMPLE.shorts.expected=FIRST_7
SUNNXT_ENTITLEMENT_SAMPLE_CREDENTIAL_MOBILE=
SUNNXT_ENTITLEMENT_SAMPLE_CREDENTIAL_PASSWORD=

# ==================== COMBO QUARTERLY PLATINUM ====================
ads.COMBO_QUARTERLY.enabled=true
ads.COMBO_QUARTERLY.plan=Combo Quarterly Platinum
ads.COMBO_QUARTERLY.sn.expected=PLAY
ads.COMBO_QUARTERLY.ads.expected=ADS
ads.COMBO_QUARTERLY.shorts.expected=FULL
SUNNXT_ENTITLEMENT_COMBO_QUARTERLY_CREDENTIAL_MOBILE=
SUNNXT_ENTITLEMENT_COMBO_QUARTERLY_CREDENTIAL_PASSWORD=
# Existing keys confirmed by the user. Only this account references this pair.
ads.COMBO_QUARTERLY.username.config.key=test.platinumCombo
ads.COMBO_QUARTERLY.password.config.key=test.password1

# ==================== SN QUARTERLY LITE ====================
ads.SN_LITE.enabled=false
ads.SN_LITE.plan=SN Quarterly Lite
ads.SN_LITE.sn.expected=PLAY
ads.SN_LITE.ads.expected=ADS
ads.SN_LITE.shorts.expected=FIRST_7
SUNNXT_ENTITLEMENT_SN_LITE_CREDENTIAL_MOBILE=
SUNNXT_ENTITLEMENT_SN_LITE_CREDENTIAL_PASSWORD=

# ==================== SNS QUARTERLY LITE ====================
ads.SNS_LITE.enabled=false
ads.SNS_LITE.plan=SNS Quarterly Lite
ads.SNS_LITE.sn.expected=BLOCK
ads.SNS_LITE.ads.expected=ADS
ads.SNS_LITE.shorts.expected=FULL
SUNNXT_ENTITLEMENT_SNS_LITE_CREDENTIAL_MOBILE=
SUNNXT_ENTITLEMENT_SNS_LITE_CREDENTIAL_PASSWORD=

# ==================== SNS ANNUAL PREMIUM ====================
ads.SNS_PREMIUM.enabled=false
ads.SNS_PREMIUM.plan=SNS Annual Premium
ads.SNS_PREMIUM.sn.expected=BLOCK
ads.SNS_PREMIUM.ads.expected=NO_ADS
ads.SNS_PREMIUM.shorts.expected=FULL
SUNNXT_ENTITLEMENT_SNS_PREMIUM_CREDENTIAL_MOBILE=
SUNNXT_ENTITLEMENT_SNS_PREMIUM_CREDENTIAL_PASSWORD=
